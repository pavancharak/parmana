version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directories:
      - "/python"
      - "/python-connector-sdk"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the SHA-pinned actions in .github/workflows/*.yml current —
  # Dependabot understands the "@<sha> # vX.Y.Z" comment convention and
  # opens a PR bumping both when a new release is out.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
