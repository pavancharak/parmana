name: Dependency Review

on:
  pull_request:
    branches:
      - main
  # Lets a maintainer start this check by hand on a PR head whose runs never started.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # A manual run has no pull_request event to read the refs from, so the
      # base and head are passed in. Pull request runs are unchanged.
      - name: Dependency Review (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: main
          head-ref: ${{ github.sha }}
